[project]
name = "autocad-mcp"
version = "0.5.0"
description = "Local MCP server that connects Claude to AutoCAD, BricsCAD, ZWCAD, GstarCAD or DXF/DWG files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "ezdxf==1.4.5",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
pdf = ["matplotlib==3.11.2"]

[project.scripts]
autocad-mcp = "autocad_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocad_mcp = ["standards/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
