[project]
name = "autocad-mcp"
version = "0.1.0"
description = "Local MCP server that connects Claude Desktop to AutoCAD (Windows, via COM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "pywin32==312",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autocad-mcp = "autocad_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocad_mcp = ["standards/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
