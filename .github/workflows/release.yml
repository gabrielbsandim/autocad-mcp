name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra pdf
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . "autocad-mcp-${GITHUB_REF_NAME}.mcpb"
      - run: gh release create "$GITHUB_REF_NAME" "autocad-mcp-${GITHUB_REF_NAME}.mcpb" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
